<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhengyu 的个人主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen items-center justify-center p-6">

    <!-- 右上角语言切换按钮 -->
    <div class="absolute top-6 right-6">
        <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-100 transition">
            EN / 中文
        </button>
    </div>

    <!-- 核心卡片容器 -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center space-y-6">
        
        <div class="w-24 h-24 bg-blue-500 text-white text-3xl font-bold flex items-center justify-center rounded-full mx-auto shadow-md">
            Z
        </div>

        <div>
            <!-- 注意这里加了 data-i18n 属性 -->
            <h1 class="text-2xl font-bold tracking-tight" data-i18n="name">Zhengyu Chen</h1>
            <p class="text-sm text-slate-500 mt-1" data-i18n="subtitle">Accounting & Finance · Developer in Progress</p>
            <p class="text-xs text-slate-400 mt-2" data-i18n="desc">兼顾专业与记录的数字枢纽站</p>
        </div>

        <!-- 导航链接板块 -->
        <div class="space-y-3">
            <a href="resume.html" class="block w-full py-3 px-4 bg-slate-100 hover:bg-blue-600 hover:text-white rounded-xl font-medium transition duration-200 shadow-sm" data-i18n="nav_resume">
                📄 在线简历 (Resume / CV)
            </a>
            <a href="projects.html" class="block w-full py-3 px-4 bg-slate-100 hover:bg-blue-600 hover:text-white rounded-xl font-medium transition duration-200 shadow-sm" data-i18n="nav_projects">
                💻 项目与代码 (Projects)
            </a>
            <a href="blog.html" class="block w-full py-3 px-4 bg-slate-100 hover:bg-blue-600 hover:text-white rounded-xl font-medium transition duration-200 shadow-sm" data-i18n="nav_blog">
                ✍️ 个人博客与随笔 (Blog & Trading Journal)
            </a>
            <a href="contact.html" class="block w-full py-3 px-4 bg-slate-100 hover:bg-blue-600 hover:text-white rounded-xl font-medium transition duration-200 shadow-sm" data-i18n="nav_contact">
                📬 联系方式 (Contact)
            </a>
        </div>

        <div class="text-xs text-slate-400 pt-4 border-t border-slate-100" data-i18n="footer">
            © 2026 Zhengyu. Built with HTML & Tailwind.
        </div>
    </div>

    <!-- 第二步：编写中英文语言包与切换逻辑的 JavaScript -->
    <script>
        // 定义中英文翻译词典
        const translations = {
            zh: {
                name: "Zhengyu Chen",
                subtitle: "Accounting & Finance · Developer in Progress",
                desc: "兼顾专业与记录的数字枢纽站",
                nav_resume: "📄 在线简历 (Resume / CV)",
                nav_projects: "💻 项目与代码 (Projects)",
                nav_blog: "✍️ 个人博客与随笔 (Blog & Trading Journal)",
                nav_contact: "📬 联系方式 (Contact)",
                footer: "© 2026 Zhengyu. Built with HTML & Tailwind."
            },
            en: {
                name: "Zhengyu Chen",
                subtitle: "Accounting & Finance · Developer in Progress",
                desc: "Digital Hub for Professional & Personal Notes",
                nav_resume: "📄 Resume / CV",
                nav_projects: "💻 Projects & Code",
                nav_blog: "✍️ Blog & Trading Journal",
                nav_contact: "📬 Contact",
                footer: "© 2026 Zhengyu. Built with HTML & Tailwind."
            }
        };

        // 默认语言设为中文
        let currentLang = 'zh';

        // 切换语言的函数
        function toggleLanguage() {
            // 在中文和英文之间切换
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            
            // 找到所有带有 data-i18n 属性的标签
            const elements = document.querySelectorAll('[data-i18n]');
            
            // 逐个替换成对应语言的文字
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });

            // 更改按钮上的提示文字
            const btn = document.getElementById('lang-btn');
            btn.textContent = currentLang === 'zh' ? 'EN / 中文' : '中文 / EN';
        }
    </script>
</body>
</html>
