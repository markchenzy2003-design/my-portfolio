backend:
  name: github
  repo: markchenzy2003-design/my-portfolio  # 替换成你真实的 GitHub 用户名/仓库名
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "博客文章 (Blogs)"
    folder: "content"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "正文内容", name: "body", widget: "markdown"}
